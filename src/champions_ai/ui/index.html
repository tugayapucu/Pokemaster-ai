<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Champions AI - board</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --edge: #2a2f3a; --ink: #e6e8ec;
    --dim: #9aa3b2; --ours: #2f6f4f; --theirs: #7a3b3b; --key: #3b5bdb; --warn: #b45309;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
           padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--edge); }
  main { display: grid; grid-template-columns: 1fr 360px; gap: 12px; padding: 12px; }
  /* The advice is the point of the page. Wide: pinned beside the board, so it
     never scrolls away. Narrow -- a window beside the game -- first, not last. */
  .advice { position: sticky; top: 8px; align-self: start; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .advice { order: -1; position: static; }
  }
  .panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 10px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
       margin: 0 0 8px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
  .card { border: 1px solid var(--edge); border-radius: 8px; padding: 8px; background: #191c22; }
  .card.active { border-color: var(--key); }
  .card.fainted { opacity: .45; }
  .card.theirs { border-left: 3px solid var(--theirs); }
  .card.ours { border-left: 3px solid var(--ours); }
  .name { font-weight: 600; display: flex; justify-content: space-between; gap: 6px; }
  .hpbar { height: 14px; background: #2a2f3a; border-radius: 4px; margin: 6px 0;
           overflow: hidden; cursor: pointer; }
  .hpbar:hover { outline: 1px solid var(--key); }
  .hpbox { width: 56px; }
  #best { font-weight: 600; }
  .hpbar i { display: block; height: 100%; background: #4ade80; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  button { background: #232833; color: var(--ink); border: 1px solid var(--edge);
           border-radius: 6px; padding: 4px 8px; cursor: pointer; font: inherit; }
  button:hover { background: #2c3340; }
  button:disabled { opacity: .4; cursor: default; }
  button.key { background: var(--key); border-color: var(--key); }
  button.warn { background: var(--warn); border-color: var(--warn); }
  .chip { font-size: 12px; color: var(--dim); }
  .tag { display: inline-flex; align-items: center; gap: 4px; background: #232833;
         border: 1px solid var(--edge); border-radius: 12px; padding: 2px 4px 2px 10px; }
  .tag button { padding: 0 6px; border: 0; background: transparent; color: var(--dim); }
  .advice li { margin-bottom: 8px; list-style: none; }
  .advice ol { padding: 0; margin: 0; }
  .advice .top { font-weight: 600; }
  .advice .note { color: var(--dim); font-size: 12px; }
  .advice .why { color: var(--dim); font-size: 12px; margin-left: 10px; }
  .problem { color: #fca5a5; }
  input { background: #232833; color: var(--ink); border: 1px solid var(--edge);
          border-radius: 6px; padding: 5px 7px; font: inherit; }
  #line { width: 100%; }
  #msg { color: var(--dim); }
  #refused { color: #fca5a5; }
  .setup { max-width: 680px; margin: 24px auto; }
  .setup p { color: var(--dim); }
  .search { position: relative; }
  .search input { width: 100%; }
  .suggest { position: absolute; z-index: 10; left: 0; right: 0; top: 100%; margin-top: 2px;
             background: #20242d; border: 1px solid var(--edge); border-radius: 6px;
             max-height: 260px; overflow-y: auto; }
  .suggest div { padding: 5px 8px; cursor: pointer; }
  .suggest div.on, .suggest div:hover { background: var(--key); }
</style>
</head>
<body>
<header>
  <strong>Champions AI</strong>
  <span id="turn" class="chip"></span>
  <span id="field" class="chip"></span>
  <span id="best"></span>
  <span style="flex:1"></span>
  <span id="msg"></span>
  <span id="refused"></span>
</header>
<div id="app"></div>

<script src="/search.js"></script>
<script>
const $ = (sel, root = document) => root.querySelector(sel);
let state = null;
let names = { species: [], moves: [], items: [] };

// A failed request used to leave the page showing the last good state, which
// reads exactly like "it recommends nothing". Now it says so, in red.
function failed(message) {
  $("#refused").textContent = message + " -- see the terminal for details.";
}
async function post(path, body) {
  try {
    const response = await fetch(path, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body || {}),
    });
    const payload = await response.json();
    if (!response.ok) { failed(payload.error || `server error ${response.status}`); return; }
    state = payload;
    render();
  } catch (error) {
    failed(`could not reach the board server (${error.message})`);
  }
}
async function load() {
  try {
    names = await (await fetch("/api/names")).json();
    state = await (await fetch("/api/state")).json();
    render();
  } catch (error) {
    failed(`could not reach the board server (${error.message})`);
  }
}
const send = (line) => post("/api/command", {line});

// ---- search box ----------------------------------------------------------
// Suggests from a fragment or a typo; the player picks with a click, the arrow
// keys and Enter, or Tab. What is sent is always the exact id picked, never a
// guess -- the typed language refuses anything unclear, and this is what stops
// that from costing time.
function searchBox({ placeholder, entries, onPick, keepOpen = false }) {
  const wrap = document.createElement("div");
  wrap.className = "search";
  const input = document.createElement("input");
  input.placeholder = placeholder;
  input.autocomplete = "off";
  const list = document.createElement("div");
  list.className = "suggest";
  list.hidden = true;
  wrap.append(input, list);
  let shown = [];
  let at = 0;

  function draw() {
    const source = typeof entries === "function" ? entries(input.value) : entries;
    const query = typeof entries === "function" && source.query !== undefined
      ? source.query : input.value;
    shown = Search.rank(query, source.list || source, 8);
    at = 0;
    list.innerHTML = "";
    shown.forEach((entry, index) => {
      const row = document.createElement("div");
      row.textContent = entry.name;
      if (index === at) row.className = "on";
      row.onmousedown = (event) => { event.preventDefault(); pick(index); };
      list.append(row);
    });
    list.hidden = !shown.length;
  }
  function mark() {
    [...list.children].forEach((row, index) => { row.className = index === at ? "on" : ""; });
  }
  function pick(index) {
    const entry = shown[index];
    if (!entry) return;
    onPick(entry, input);
    if (!keepOpen) { input.value = ""; list.hidden = true; }
  }
  input.oninput = draw;
  input.onblur = () => { list.hidden = true; };
  input.onkeydown = (event) => {
    if (list.hidden && event.key !== "Enter") return;
    if (event.key === "ArrowDown") { event.preventDefault(); at = Math.min(at + 1, shown.length - 1); mark(); }
    else if (event.key === "ArrowUp") { event.preventDefault(); at = Math.max(at - 1, 0); mark(); }
    else if (event.key === "Enter" || event.key === "Tab") {
      if (shown.length) { event.preventDefault(); pick(at); }
    } else if (event.key === "Escape") { list.hidden = true; }
  };
  return { wrap, input };
}

// ---- Team Preview ----------------------------------------------------------
function setup() {
  const app = $("#app");
  const six = [];
  const picks = [];
  const leads = [];
  app.innerHTML = `
    <div class="panel setup">
      <h2>Team Preview</h2>
      <p>Their ${state.team_size}: type a few letters of each and pick it (typos are fine).
         Then click your ${state.picked_team_size} in lead order, and click their
         ${state.slots} leads.</p>
      <div id="sixsearch"></div>
      <div class="row" id="sixtags" style="margin:6px 0 12px"></div>
      <div class="chip">Your ${state.picked_team_size}, in lead order</div>
      <div class="row" id="picks" style="margin-bottom:12px"></div>
      <div class="chip">Their ${state.slots} leads</div>
      <div class="row" id="leads" style="margin-bottom:12px"></div>
      <div class="row"><button class="key" id="go" disabled>Start</button></div>
    </div>`;

  const box = searchBox({
    placeholder: "their Pokemon: kingambit, rilaboom, pelip...",
    entries: names.species,
    onPick: (entry) => {
      if (six.length < state.team_size && !six.some((m) => m.id === entry.id)) six.push(entry);
      draw();
    },
  });
  $("#sixsearch").append(box.wrap);

  function draw() {
    const tags = $("#sixtags");
    tags.innerHTML = "";
    six.forEach((mon, index) => {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = mon.name;
      const drop = document.createElement("button");
      drop.textContent = "×";
      drop.onclick = () => {
        six.splice(index, 1);
        const lead = leads.indexOf(mon.id);
        if (lead >= 0) leads.splice(lead, 1);
        draw();
      };
      tag.append(drop);
      tags.append(tag);
    });
    box.input.disabled = six.length >= state.team_size;
    box.input.placeholder = six.length >= state.team_size
      ? "all six named" : `their Pokemon (${six.length}/${state.team_size})`;

    const ours = $("#picks");
    ours.innerHTML = "";
    state.team.forEach((mon) => {
      const button = document.createElement("button");
      const order = picks.indexOf(mon.index);
      button.className = order >= 0 ? "key" : "";
      button.textContent = order >= 0 ? `${order + 1}. ${mon.species}` : mon.species;
      button.onclick = () => {
        const at = picks.indexOf(mon.index);
        if (at >= 0) picks.splice(at, 1);
        else if (picks.length < state.picked_team_size) picks.push(mon.index);
        draw();
      };
      ours.append(button);
    });

    const theirs = $("#leads");
    theirs.innerHTML = six.length ? "" : '<span class="chip">name their six first</span>';
    six.forEach((mon) => {
      const button = document.createElement("button");
      const order = leads.indexOf(mon.id);
      button.className = order >= 0 ? "key" : "";
      button.textContent = order >= 0 ? `${order + 1}. ${mon.name}` : mon.name;
      button.onclick = () => {
        const at = leads.indexOf(mon.id);
        if (at >= 0) leads.splice(at, 1);
        else if (leads.length < state.slots) leads.push(mon.id);
        draw();
      };
      theirs.append(button);
    });

    $("#go").disabled = !(six.length === state.team_size
      && picks.length === state.picked_team_size && leads.length === state.slots);
  }
  $("#go").onclick = () => post("/api/start", {
    their_team: six.map((m) => m.id), picks, leads,
  });
  draw();
  box.input.focus();
}

// ---- the board -------------------------------------------------------------
function button(label, onclick, cls) {
  const b = document.createElement("button");
  b.textContent = label;
  if (cls) b.className = cls;
  b.onclick = onclick;
  return b;
}

function hpButtons(side, mon) {
  const row = document.createElement("div");
  row.className = "row";
  [100, 75, 50, 25].forEach((pct) => row.append(button(pct, () => send(`${side} ${mon.id} ${pct}`))));
  row.append(button("KO", () => send(`${side} ${mon.id} ko`), "warn"));
  // Any value: type it and press Enter. The bar above is also clickable.
  const box = document.createElement("input");
  box.className = "hpbox";
  box.placeholder = "HP %";
  box.inputMode = "numeric";
  box.onkeydown = (event) => {
    if (event.key !== "Enter") return;
    const pct = parseInt(box.value, 10);
    if (Number.isNaN(pct) || pct < 0 || pct > 100) { failed("HP is a number from 0 to 100"); return; }
    send(pct === 0 ? `${side} ${mon.id} ko` : `${side} ${mon.id} ${pct}`);
  };
  row.append(box);
  return row;
}

function statusRow(side, mon) {
  const row = document.createElement("div");
  row.className = "row";
  ["brn", "par", "psn", "tox", "slp", "frz", "ok"].forEach((status) =>
    row.append(button(status, () => send(`${side} ${mon.id} ${status}`))));
  return row;
}

function stageRow(side, mon) {
  const row = document.createElement("div");
  row.className = "row";
  ["atk", "def", "spa", "spd", "spe"].forEach((stat) => {
    const now = mon.stages[stat] || 0;
    ["-1", "+1"].forEach((step) => row.append(button(`${stat}${step}`, () => {
      const next = Math.max(-6, Math.min(6, now + (step === "+1" ? 1 : -1)));
      send(`${side} ${mon.id} ${next >= 0 ? "+" : ""}${next} ${stat}`);
    })));
  });
  return row;
}

function bringIn(side, id, actives, names) {
  const row = document.createElement("div");
  row.className = "row";
  actives.forEach((_, slot) => {
    row.append(button(`in for ${names[slot] || "slot " + (slot + 1)}`, () => {
      const line = names.map((name, index) => (index === slot ? id : name));
      send(`${side === "their" ? "they" : "we"} ${line.join(" ")}`);
    }));
  });
  return row;
}

function sawBox(mon) {
  // Moves by default; `item ...` searches items; `ability ...` is sent as typed.
  const box = searchBox({
    placeholder: "saw a move (or: item ..., ability ...)",
    entries: (text) => {
      const item = /^item\s+(.*)$/i.exec(text);
      if (item) return { list: names.items, query: item[1] };
      if (/^ability\s/i.test(text)) return { list: [], query: "" };
      return { list: names.moves, query: text };
    },
    onPick: (entry, input) => {
      const isItem = /^item\s/i.test(input.value);
      send(`their ${mon.id} ${isItem ? "item" : "saw"} ${entry.name}`);
    },
  });
  box.input.addEventListener("keydown", (event) => {
    // An ability has no list to pick from, so Enter sends what was typed.
    const text = box.input.value.trim();
    if (event.key === "Enter" && /^ability\s+\S/i.test(text)) {
      send(`their ${mon.id} ${text}`);
      box.input.value = "";
    }
  });
  return box.wrap;
}

function card(side, mon, actives, others) {
  const el = document.createElement("div");
  el.className = `card ${side === "their" ? "theirs" : "ours"}`
    + (mon.slot !== null && mon.slot !== undefined ? " active" : "")
    + (mon.fainted ? " fainted" : "");
  const stages = Object.entries(mon.stages || {}).map(([k, v]) => `${k} ${v > 0 ? "+" : ""}${v}`);
  el.innerHTML = `
    <div class="name"><span>${mon.species}</span>
      <span class="chip">${mon.hp_percent}%${mon.status ? " " + mon.status : ""}</span></div>
    <div class="hpbar"><i style="width:${mon.hp_percent}%"></i></div>
    <div class="chip">${[
      mon.item ? "item: " + mon.item : (mon.item_gone ? "item gone" : ""),
      mon.ability ? "ability: " + mon.ability : "",
      stages.join(" "),
    ].filter(Boolean).join(" · ")}</div>`;
  // Click along the bar to set HP there: two-thirds of the way is 67%.
  const bar = el.querySelector(".hpbar");
  bar.title = "click to set HP here";
  bar.onclick = (event) => {
    const box = bar.getBoundingClientRect();
    const pct = Math.max(1, Math.min(100, Math.round(100 * (event.clientX - box.left) / box.width)));
    send(`${side} ${mon.id} ${pct}`);
  };
  el.append(hpButtons(side, mon), statusRow(side, mon), stageRow(side, mon));

  if (side === "their") {
    const row = document.createElement("div");
    row.className = "row";
    row.style.display = "block";
    row.append(sawBox(mon));
    el.append(row);
    if (mon.moves && mon.moves.length) {
      const seen = document.createElement("div");
      seen.className = "chip";
      seen.textContent = "seen: " + mon.moves.join(", ");
      el.append(seen);
    }
  } else if (mon.moves) {
    const moves = document.createElement("div");
    moves.className = "chip";
    moves.textContent = mon.moves
      .map((m) => `${m.name}${m.pp !== null ? " (" + m.pp + ")" : ""}${m.disabled ? " x" : ""}`)
      .join(" · ");
    el.append(moves);
  }

  if (!mon.fainted && (mon.slot === null || mon.slot === undefined)) {
    el.append(bringIn(side, mon.id, actives, others));
  }
  return el;
}

function fieldRow() {
  const row = document.createElement("div");
  row.className = "row";
  const add = (label, line, cls) => row.append(button(label, () => send(line), cls));
  ["sun", "rain", "sand", "snow"].forEach((w) => add(w, `weather ${w}`));
  add("no weather", "weather none");
  ["grassy", "electric", "psychic", "misty"].forEach((t) => add(t, `terrain ${t}`));
  add("no terrain", "terrain none");
  add("trick room", "room");
  add("room off", "room none");
  add("tailwind us", "tailwind us");
  add("tailwind them", "tailwind them");
  add("mega us", "mega us");
  add("mega them", "mega them");
  add("next turn", "n", "key");
  return row;
}

function render() {
  if (!state) return;
  $("#refused").textContent = state.refused || "";
  $("#msg").textContent = state.message || "";
  if (!state.ready) {
    $("#turn").textContent = "";
    $("#field").textContent = "";
    $("#best").textContent = "";
    if (!$("#sixsearch")) setup();
    return;
  }

  const b = state.board;
  const top = state.advice.recommendations && state.advice.recommendations[0];
  $("#best").textContent = top ? `Top: ${top.description}` : (state.advice.problem || "");
  $("#turn").textContent = `turn ${b.turn}`;
  $("#field").textContent = [b.weather, b.terrain, ...Object.keys(b.field_conditions)]
    .filter(Boolean).join(" · ");

  const theirNames = b.theirs.active.map((i) => (i === null ? "" : b.theirs.seen[i].id));
  const ourNames = b.ours.active.map((i) => (i === null ? "" : b.ours.team[i].id));

  const app = $("#app");
  app.innerHTML = `<main>
      <div>
        <div class="panel"><h2>Them</h2><div class="cards" id="them"></div>
          <div id="unseen" style="margin-top:6px"></div></div>
        <div class="panel" style="margin-top:12px"><h2>You</h2><div class="cards" id="us"></div></div>
        <div class="panel" style="margin-top:12px"><h2>Field</h2><div id="fieldrow"></div>
          <div class="row" style="margin-top:8px">
            <input id="line" placeholder="or type: char 55; gambit ko">
          </div>
          <div class="row"><button id="undo">undo</button></div>
        </div>
      </div>
      <div class="panel advice"><h2>Recommended</h2><div id="advice"></div></div>
    </main>`;

  const them = $("#them");
  b.theirs.seen.forEach((mon) => them.append(card("their", mon, b.theirs.active, theirNames)));
  const unseen = $("#unseen");
  if (b.theirs.unseen.length) {
    const label = document.createElement("div");
    label.className = "chip";
    label.textContent = "not seen yet - click to bring one in:";
    unseen.append(label);
    b.theirs.unseen.forEach((mon) => {
      const line = document.createElement("div");
      line.className = "row";
      const name = document.createElement("span");
      name.className = "chip";
      name.style.minWidth = "110px";
      name.textContent = mon.species;
      line.append(name, ...bringIn("their", mon.id, b.theirs.active, theirNames).children);
      unseen.append(line);
    });
  }
  const us = $("#us");
  b.ours.team.forEach((mon) => us.append(card("my", mon, b.ours.active, ourNames)));
  $("#fieldrow").append(fieldRow());

  const advice = $("#advice");
  if (state.advice.problem) {
    advice.innerHTML = `<div class="problem">${state.advice.problem}</div>`;
  } else {
    const list = document.createElement("ol");
    state.advice.recommendations.forEach((entry) => {
      const item = document.createElement("li");
      item.innerHTML = `<div class="${entry.rank === 1 ? "top" : ""}">${entry.rank}. `
        + `${entry.description}</div><div class="note">${entry.note}</div>`
        + entry.reasons.map((r) => `<div class="why">- ${r}</div>`).join("");
      list.append(item);
    });
    advice.append(list);
    const chip = document.createElement("div");
    chip.className = "note";
    chip.textContent = `${state.advice.considered} actions considered`
      + (state.advice.clear ? "" : " - close call");
    advice.append(chip);
  }

  $("#undo").onclick = () => post("/api/undo");
  const line = $("#line");
  line.onkeydown = (event) => {
    if (event.key === "Enter" && line.value.trim()) { send(line.value.trim()); line.value = ""; }
  };
}

document.addEventListener("keydown", (event) => {
  const typing = ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName);
  if (typing || !state || !state.ready) return;
  if (event.key === "n") send("n");
  if (event.key === "u") post("/api/undo");
  if (event.key === "/") { event.preventDefault(); $("#line")?.focus(); }
});

load();
</script>
</body>
</html>
