<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Champions AI - board</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --edge: #2a2f3a; --ink: #e6e8ec;
    --dim: #9aa3b2; --ours: #2f6f4f; --theirs: #7a3b3b; --key: #3b5bdb; --warn: #b45309;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
           padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--edge); }
  main { display: grid; grid-template-columns: 1fr 360px; gap: 12px; padding: 12px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 10px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
       margin: 0 0 8px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
  .card { border: 1px solid var(--edge); border-radius: 8px; padding: 8px; background: #191c22; }
  .card.active { border-color: var(--key); }
  .card.fainted { opacity: .45; }
  .card.theirs { border-left: 3px solid var(--theirs); }
  .card.ours { border-left: 3px solid var(--ours); }
  .name { font-weight: 600; display: flex; justify-content: space-between; gap: 6px; }
  .hpbar { height: 6px; background: #2a2f3a; border-radius: 3px; margin: 6px 0; overflow: hidden; }
  .hpbar i { display: block; height: 100%; background: #4ade80; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  button { background: #232833; color: var(--ink); border: 1px solid var(--edge);
           border-radius: 6px; padding: 4px 8px; cursor: pointer; font: inherit; }
  button:hover { background: #2c3340; }
  button.key { background: var(--key); border-color: var(--key); }
  button.warn { background: var(--warn); border-color: var(--warn); }
  .chip { font-size: 12px; color: var(--dim); }
  .advice li { margin-bottom: 8px; list-style: none; }
  .advice ol { padding: 0; margin: 0; }
  .advice .top { font-weight: 600; }
  .advice .note { color: var(--dim); font-size: 12px; }
  .advice .why { color: var(--dim); font-size: 12px; margin-left: 10px; }
  .problem { color: #fca5a5; }
  input, select { background: #232833; color: var(--ink); border: 1px solid var(--edge);
                  border-radius: 6px; padding: 5px 7px; font: inherit; }
  #line { width: 100%; }
  #msg { color: var(--dim); }
  #refused { color: #fca5a5; }
  .setup { max-width: 640px; margin: 24px auto; }
  .setup p { color: var(--dim); }
  .pick { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
</style>
</head>
<body>
<header>
  <strong>Champions AI</strong>
  <span id="turn" class="chip"></span>
  <span id="field" class="chip"></span>
  <span style="flex:1"></span>
  <span id="msg"></span>
  <span id="refused"></span>
</header>
<div id="app"></div>

<script>
const $ = (sel, root = document) => root.querySelector(sel);
let state = null;

async function post(path, body) {
  const response = await fetch(path, {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body || {}),
  });
  state = await response.json();
  render();
}
async function load() {
  state = await (await fetch("/api/state")).json();
  render();
}
const send = (line) => post("/api/command", {line});

function setup() {
  const app = $("#app");
  app.innerHTML = `
    <div class="panel setup">
      <h2>Team Preview</h2>
      <p>Their ${state.team_size}, as the screen shows them. Then the ${state.picked_team_size}
         you brought, in lead order, then their leads.</p>
      <label>Their ${state.team_size}<br><input id="six" style="width:100%"
        placeholder="kingambit rillaboom pelipper sneasler salamence basculegion"></label>
      <div id="picks" style="margin:10px 0"></div>
      <label>Their ${state.slots} leads<br><input id="leads" style="width:100%"
        placeholder="kingambit rillaboom"></label>
      <div class="row" style="margin-top:10px">
        <button class="key" id="go">Start</button>
      </div>
    </div>`;
  const picks = $("#picks");
  picks.innerHTML = `<div class="chip">Click your ${state.picked_team_size} in lead order</div>`;
  const chosen = [];
  state.team.forEach((mon) => {
    const line = document.createElement("div");
    line.className = "pick";
    const button = document.createElement("button");
    button.textContent = mon.species;
    button.onclick = () => {
      const at = chosen.indexOf(mon.index);
      if (at >= 0) chosen.splice(at, 1);
      else if (chosen.length < state.picked_team_size) chosen.push(mon.index);
      [...picks.querySelectorAll("button")].forEach((b, i) => {
        const order = chosen.indexOf(state.team[i].index);
        b.className = order >= 0 ? "key" : "";
        b.textContent = order >= 0
          ? `${order + 1}. ${state.team[i].species}` : state.team[i].species;
      });
    };
    line.append(button);
    picks.append(line);
  });
  $("#go").onclick = () => post("/api/start", {
    their_team: $("#six").value.replace(/,/g, " ").split(/\s+/).filter(Boolean),
    picks: chosen,
    leads: $("#leads").value.replace(/,/g, " ").split(/\s+/).filter(Boolean),
  });
}

function hpButtons(side, mon) {
  const row = document.createElement("div");
  row.className = "row";
  [100, 75, 50, 25].forEach((pct) => {
    const b = document.createElement("button");
    b.textContent = pct;
    b.onclick = () => send(`${side} ${mon.id} ${pct}`);
    row.append(b);
  });
  const ko = document.createElement("button");
  ko.className = "warn";
  ko.textContent = "KO";
  ko.onclick = () => send(`${side} ${mon.id} ko`);
  row.append(ko);
  return row;
}

function statusRow(side, mon) {
  const row = document.createElement("div");
  row.className = "row";
  ["brn", "par", "psn", "tox", "slp", "frz", "ok"].forEach((status) => {
    const b = document.createElement("button");
    b.textContent = status;
    b.onclick = () => send(`${side} ${mon.id} ${status}`);
    row.append(b);
  });
  return row;
}

function stageRow(side, mon) {
  const row = document.createElement("div");
  row.className = "row";
  ["atk", "def", "spa", "spd", "spe"].forEach((stat) => {
    const now = mon.stages[stat] || 0;
    ["-1", "+1"].forEach((step) => {
      const b = document.createElement("button");
      b.textContent = `${stat}${step}`;
      b.onclick = () => {
        const next = Math.max(-6, Math.min(6, now + (step === "+1" ? 1 : -1)));
        send(`${side} ${mon.id} ${next >= 0 ? "+" : ""}${next} ${stat}`);
      };
      row.append(b);
    });
  });
  return row;
}

function card(side, mon, actives, others) {
  const el = document.createElement("div");
  el.className = `card ${side === "their" ? "theirs" : "ours"}`
    + (mon.slot !== null && mon.slot !== undefined ? " active" : "")
    + (mon.fainted ? " fainted" : "");
  const stages = Object.entries(mon.stages || {}).map(([k, v]) => `${k} ${v > 0 ? "+" : ""}${v}`);
  el.innerHTML = `
    <div class="name"><span>${mon.species}</span>
      <span class="chip">${mon.hp_percent}%${mon.status ? " " + mon.status : ""}</span></div>
    <div class="hpbar"><i style="width:${mon.hp_percent}%"></i></div>
    <div class="chip">${[
      mon.item ? "item: " + mon.item : (mon.item_gone ? "item gone" : ""),
      mon.ability ? "ability: " + mon.ability : "",
      stages.join(" "),
    ].filter(Boolean).join(" · ")}</div>`;
  el.append(hpButtons(side, mon), statusRow(side, mon), stageRow(side, mon));

  if (side === "their") {
    const saw = document.createElement("div");
    saw.className = "row";
    const box = document.createElement("input");
    box.placeholder = "saw move / item / ability";
    box.onkeydown = (event) => {
      if (event.key !== "Enter" || !box.value.trim()) return;
      const text = box.value.trim();
      const head = /^(item|ability)\s/i.test(text) ? "" : "saw ";
      send(`their ${mon.id} ${head}${text}`);
      box.value = "";
    };
    saw.append(box);
    el.append(saw);
    if (mon.moves && mon.moves.length) {
      const seen = document.createElement("div");
      seen.className = "chip";
      seen.textContent = "seen: " + mon.moves.join(", ");
      el.append(seen);
    }
  } else if (mon.moves) {
    const moves = document.createElement("div");
    moves.className = "chip";
    moves.textContent = mon.moves
      .map((m) => `${m.name}${m.pp !== null ? " (" + m.pp + ")" : ""}${m.disabled ? " x" : ""}`)
      .join(" · ");
    el.append(moves);
  }

  if (!mon.fainted && (mon.slot === null || mon.slot === undefined)) {
    const bring = document.createElement("div");
    bring.className = "row";
    actives.forEach((current, slot) => {
      const b = document.createElement("button");
      b.textContent = `in for ${others[slot] || "slot " + (slot + 1)}`;
      b.onclick = () => {
        const line = others.map((name, index) => (index === slot ? mon.id : name));
        send(`${side === "their" ? "they" : "we"} ${line.join(" ")}`);
      };
      bring.append(b);
    });
    el.append(bring);
  }
  return el;
}

function fieldRow() {
  const row = document.createElement("div");
  row.className = "row";
  const add = (label, line, cls) => {
    const b = document.createElement("button");
    b.textContent = label;
    if (cls) b.className = cls;
    b.onclick = () => send(line);
    row.append(b);
  };
  ["sun", "rain", "sand", "snow"].forEach((w) => add(w, `weather ${w}`));
  add("no weather", "weather none");
  ["grassy", "electric", "psychic", "misty"].forEach((t) => add(t, `terrain ${t}`));
  add("no terrain", "terrain none");
  add("trick room", "room");
  add("room off", "room none");
  add("tailwind us", "tailwind us");
  add("tailwind them", "tailwind them");
  add("mega us", "mega us");
  add("mega them", "mega them");
  add("next turn", "n", "key");
  return row;
}

function render() {
  if (!state) return;
  $("#refused").textContent = state.refused || "";
  $("#msg").textContent = state.message || "";
  if (!state.ready) { $("#turn").textContent = ""; $("#field").textContent = ""; setup(); return; }

  const b = state.board;
  $("#turn").textContent = `turn ${b.turn}`;
  $("#field").textContent = [b.weather, b.terrain, ...Object.keys(b.field_conditions)]
    .filter(Boolean).join(" · ");

  const theirNames = b.theirs.active.map((i) => (i === null ? "" : b.theirs.seen[i].id));
  const ourNames = b.ours.active.map((i) => (i === null ? "" : b.ours.team[i].id));

  const app = $("#app");
  app.innerHTML = `<main>
      <div>
        <div class="panel"><h2>Them</h2><div class="cards" id="them"></div>
          <div class="chip" id="unseen" style="margin-top:6px"></div></div>
        <div class="panel" style="margin-top:12px"><h2>You</h2><div class="cards" id="us"></div></div>
        <div class="panel" style="margin-top:12px"><h2>Field</h2><div id="fieldrow"></div>
          <div class="row" style="margin-top:8px">
            <input id="line" placeholder="or type: char 55; gambit ko">
          </div>
          <div class="row"><button id="undo">undo</button></div>
        </div>
      </div>
      <div class="panel advice"><h2>Recommended</h2><div id="advice"></div></div>
    </main>`;

  const them = $("#them");
  b.theirs.seen.forEach((mon) => them.append(card("their", mon, b.theirs.active, theirNames)));
  $("#unseen").textContent = b.theirs.unseen.length
    ? "not seen yet: " + b.theirs.unseen.map((m) => m.species).join(", ") : "";
  const us = $("#us");
  b.ours.team.forEach((mon) => us.append(card("my", mon, b.ours.active, ourNames)));
  $("#fieldrow").append(fieldRow());

  const advice = $("#advice");
  if (state.advice.problem) {
    advice.innerHTML = `<div class="problem">${state.advice.problem}</div>`;
  } else {
    const list = document.createElement("ol");
    state.advice.recommendations.forEach((entry) => {
      const item = document.createElement("li");
      item.innerHTML = `<div class="${entry.rank === 1 ? "top" : ""}">${entry.rank}. `
        + `${entry.description}</div><div class="note">${entry.note}</div>`
        + entry.reasons.map((r) => `<div class="why">- ${r}</div>`).join("");
      list.append(item);
    });
    advice.append(list);
    const chip = document.createElement("div");
    chip.className = "note";
    chip.textContent = `${state.advice.considered} actions considered`
      + (state.advice.clear ? "" : " - close call");
    advice.append(chip);
  }

  $("#undo").onclick = () => post("/api/undo");
  const line = $("#line");
  line.onkeydown = (event) => {
    if (event.key === "Enter" && line.value.trim()) { send(line.value.trim()); line.value = ""; }
  };
}

document.addEventListener("keydown", (event) => {
  const typing = ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName);
  if (typing) return;
  if (event.key === "n") send("n");
  if (event.key === "u") post("/api/undo");
  if (event.key === "/") { event.preventDefault(); $("#line")?.focus(); }
});

load();
</script>
</body>
</html>
