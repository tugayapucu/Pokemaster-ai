[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "champions-ai"
version = "0.1.0"
description = "Pokemon Champions battle recommendation and autonomous agent research platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/champions_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
